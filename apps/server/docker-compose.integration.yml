# The services the integration tests (go test -tags integration) talk to.
# CI starts them with "docker compose up -d --wait" and points the tests at them
# through the PEE_TEST_* variables. Without those variables the tests start their
# own containers, so you need this file only to reuse one set of servers:
#
#   docker compose -f docker-compose.integration.yml up -d --wait
#   PEE_TEST_REDIS_URL='redis://:integration-test-password@127.0.0.1:16379' \
#   PEE_TEST_KAFKA_BROKER='127.0.0.1:19092' PEE_TEST_KAFKA_SASL_BROKER='127.0.0.1:19093' \
#   PEE_TEST_POSTGRES_EXECUTOR_URL='postgres://peekaping:p%40ss%3Aw%2Frd%251%3Fx@127.0.0.1:15432/peekaping' \
#   PEE_TEST_MYSQL_URL='mysql://peekaping:p%40ss%3Aw%2Frd%251%3Fx@127.0.0.1:13306/peekaping' \
#   PEE_TEST_RABBITMQ_URL='http://peekaping:p%40ss%3Aw%2Frd%251@127.0.0.1:15673' \
#     go test -tags integration -count=1 ./internal/modules/healthcheck/executor/...
#   docker compose -f docker-compose.integration.yml down
#
# Each service matches a function in internal/testservice, which starts the same
# image the same way. Add a service here when you add a function there.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "integration-test-password", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "integration-test-password", "--no-auth-warning", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The same broker internal/testservice/kafka.go starts, with the host ports
  # fixed and advertised as 127.0.0.1:19092 (plaintext) and 127.0.0.1:19093
  # (SASL: user peekaping, password peekaping-secret, for PLAIN, SCRAM-SHA-256
  # and SCRAM-SHA-512). Keep its start script and kafkaStartScript in step.
  # "$$" is how compose spells a "$" it leaves to the shell.
  kafka:
    image: apache/kafka:3.9.1
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        ADV_HOST=127.0.0.1
        ADV_PLAIN_PORT=19092
        ADV_SASL_PORT=19093
        cat > /tmp/server.properties <<EOF
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@localhost:9095
        listeners=PLAINTEXT://:9092,SASL_PLAINTEXT://:9093,BROKER://localhost:9094,CONTROLLER://localhost:9095
        advertised.listeners=PLAINTEXT://$${ADV_HOST}:$${ADV_PLAIN_PORT},SASL_PLAINTEXT://$${ADV_HOST}:$${ADV_SASL_PORT},BROKER://localhost:9094
        listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=BROKER
        controller.listener.names=CONTROLLER
        sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
        listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_peekaping="peekaping-secret";
        listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        auto.create.topics.enable=true
        num.partitions=1
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        log.dirs=/tmp/kraft-logs
        EOF
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
          -t "$$(/opt/kafka/bin/kafka-storage.sh random-uuid)" -c /tmp/server.properties \
          --add-scram 'SCRAM-SHA-256=[name=peekaping,password=peekaping-secret]' \
          --add-scram 'SCRAM-SHA-512=[name=peekaping,password=peekaping-secret]'
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
    ports:
      - "127.0.0.1:19092:9092"
      - "127.0.0.1:19093:9093"
    healthcheck:
      # Asks the internal listener, which is up only once the broker is.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s

  # The same server internal/testservice/postgres.go starts, on 127.0.0.1:15432:
  # user peekaping, database peekaping, TLS on with the Debian image's
  # self-signed certificate. The password holds the characters a connection
  # string has to escape (@ : / % ?), written percent-encoded in
  # PEE_TEST_POSTGRES_EXECUTOR_URL. The health check logs in over the
  # container's own address, not 127.0.0.1, which the image trusts without a
  # password, so it passes only once that password works.
  postgres:
    image: postgres:17
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem"
      - "-c"
      - "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"
    environment:
      POSTGRES_USER: peekaping
      POSTGRES_PASSWORD: "p@ss:w/rd%1?x"
      POSTGRES_DB: peekaping
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD='p@ss:w/rd%1?x' psql -h postgres -U peekaping -d peekaping -c 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The same server internal/testservice/mysql.go starts, on 127.0.0.1:13306,
  # with the same user, database and password as the PostgreSQL above. MySQL
  # turns TLS on by itself with a self-signed certificate. The health check logs
  # in over TCP: the image's init server doesn't listen on it.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: peekaping
      MYSQL_PASSWORD: "p@ss:w/rd%1?x"
      MYSQL_DATABASE: peekaping
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='p@ss:w/rd%1?x' mysql --protocol=tcp -h 127.0.0.1 -u peekaping peekaping -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # The same broker internal/testservice/rabbitmq.go starts, with the management
  # port fixed at 127.0.0.1:15673. Its only user is peekaping, with the password
  # p@ss:w/rd%1: the characters a URL reserves, which the tests check reach the
  # broker intact. PEE_TEST_RABBITMQ_URL carries the password percent-encoded.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: peekaping
      RABBITMQ_DEFAULT_PASS: "p@ss:w/rd%1"
    ports:
      - "127.0.0.1:15673:15672"
    healthcheck:
      # Passes once the management API listens, which is all the tests use.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "15672"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s
