          description: Internal Server Error
      security:
        - JwtAuth: []
        - ApiKeyAuth: []
      summary: Get the usage ping state
      tags:
        - telemetry
    put:
      description: Opting in creates a new random instance ID unless there is one. Opting out deletes it, so opting in again gives a new one. The choice is stored while the environment forces the ping off, and the environment still wins. Any choice also marks the one-time notice as seen.
      operationId: putTelemetry
