info:
  title: Peekaping API
  version: 0.0.47
openapi: 3.1.0
paths:
  /api/v1/api-keys:
    get:
      operationId: getApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_Array_api_key.APIKeyResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Get API keys
      tags:
        - api_key
    post:
      operationId: postApiKeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key.CreateAPIKeyDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyWithTokenResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Create API key
      tags:
        - api_key
  /api/v1/api-keys/config:
    get:
      operationId: getApiKeysConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyConfigResponse"
          description: OK
      summary: Get API key configuration
      tags:
        - api_key
  /api/v1/api-keys/{id}:
    delete:
      operationId: deleteApiKeysById
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            description: API key ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Delete API key
      tags:
        - api_key
    get:
      operationId: getApiKeysById
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            description: API key ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Get API key
      tags:
        - api_key
    put:
      operationId: putApiKeysById
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            description: API key ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key.UpdateAPIKeyDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Update API key
      tags:
        - api_key
  /api/v1/auth/2fa/disable:
    post:
      operationId: postAuth2faDisable
      requestBody:
        content:
          application/json:
            schema:
