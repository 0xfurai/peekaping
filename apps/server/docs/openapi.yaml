  /api/v1/auth/register:
    post:
      description: "Who may register depends on SIGNUP_MODE. In invite mode (the default) it creates the install's first user, who is its instance admin and the owner of its first workspace, and refuses once the install has a user (400). In open mode anyone may register: it creates the user and a workspace of their own, \"My workspace\", that they own. Only the install's very first user is an instance admin. The new workspace is suspended until the user verifies their email address (GET /me says so), and the verification email is sent. In open mode a client address may register 5 times an hour (429), an email that has an account is refused (409), and when the install uses Cloudflare Turnstile the body needs turnstileToken, which the server checks: a missing, refused or unchecked answer is 400. With inviteToken, the token of an invite link, it creates the user the invite names instead: they join the inviting workspace with the invite's role, get no workspace of their own and no instance admin flag. The email must be the invited one (403), and the invite must exist (404) and not be used, expired or revoked (410). An email that has an account already is refused (409): sign in and accept the invite."
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.RegisterDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_auth.LoginResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Gone
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before sending the request again.
              schema:
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      summary: Register new admin
      tags:
        - auth
  /api/v1/auth/reset-password:
    post:
      description: "Sets the new password (the signup rules apply), marks the token used and ends every session of the user: refresh tokens and access tokens issued before are refused. The user's other unused reset links stop working. A token that is unknown, used or expired answers 400. At most 20 requests per hour from one client address; more answer 429."
