                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Opt in or out of the usage ping
      tags:
        - telemetry
  /api/v1/telemetry/notice:
    post:
      description: "An install that upgraded to a version with the usage ping and error reports on by default shows its admin a one-time notice. This marks it seen so it stops showing. It is not a choice: both features stay as they were. Making a choice with PUT /telemetry or PUT /error-reporting marks it seen too."
