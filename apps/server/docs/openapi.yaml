  /api/v1/auth/forgot-password:
    post:
      description: Emails a single-use link that resets the password and expires in one hour, if an account has the email. The answer is 202 with the same body whether it does or not, so it does not tell which addresses have accounts. At most 5 emails per hour go to one address (the request is answered the same and sends nothing past that), and a client address that asks more than 20 times an hour gets 429. 404 when the install sends no account emails.
      operationId: postAuthForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.ForgotPasswordDto"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_Any"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before sending the request again.
              schema:
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      summary: Ask for a password reset link
      tags:
