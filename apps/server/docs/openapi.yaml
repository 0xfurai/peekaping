    monitor.CreateUpdateDto:
      additionalProperties: true
      properties:
        active:
          examples:
            - true
          type: boolean
        config:
          type: string
        interval:
          examples:
            - 60
          format: int64
          minimum: 20
          type: integer
        location_rule:
          description: "How many of the monitor's locations must be Down for the monitor to be Down: any (one is enough), all (every location that counts) or at_least (location_threshold of them). Omitted on create, the rule is any; omitted on update, the monitor keeps its rule. Locations whose probe is offline, or that haven't reported, don't count."
          enum:
            - any
            - all
            - at_least
          examples:
            - any
          type: string
        location_threshold:
          description: "With the at_least rule, how many locations must be Down: from 1 to the number of probes the monitor runs on. Required with at_least and not allowed with any other rule."
          examples:
            - 2
          format: int64
          type:
            - integer
            - "null"
        max_retries:
          examples:
            - 3
          format: int64
          minimum: 0
          type: integer
        name:
          examples:
            - My Monitor
          minLength: 3
          type: string
        notification_ids:
          examples:
            - - 6830ad485361f19c598d6d90
          items:
            type: string
          type: array
        probe_ids:
          description: "The probes that run the monitor's checks, by id: one or more, none twice, and each must run the monitor's type. Omitted on create (not an empty list), the monitor runs on the default probes that aren't disabled and run its type, which an instance admin chooses and which is local until then; omitted on update, it keeps its probes. A push monitor runs on local only."
          examples:
            - - local
          items:
            type: string
          type:
            - array
            - "null"
        proxy_id:
          examples:
            - 6830ad485361f19c598d6d90
          type: string
        push_token:
