        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
        - ApiKeyAuth: []
      summary: Get the error reporting state
      tags:
        - error-reporting
    put:
      description: "Error reports are crash reports: the error type, the stack frames, the release and the install's mode, storage backend, OS and architecture. In cluster mode a change made on one api replica reaches the others within a minute. The choice is stored while the environment forces error reports off, and the environment still wins. Any choice also marks the one-time usage ping and error reports notice as seen."
      operationId: putErrorReporting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/error_reporting.UpdateDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_reporting.StateResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Opt in or out of error reports
      tags:
        - error-reporting
