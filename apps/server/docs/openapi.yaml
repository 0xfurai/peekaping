          description: Unauthorized
      security:
        - JwtAuth: []
      summary: Enable 2FA (TOTP) for user
      tags:
        - auth
  /api/v1/auth/2fa/verify:
    post:
      operationId: postAuth2faVerify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.TwoFAVerifyRequestDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.TwoFAVerifyResponseDto"
          description: OK
        "400":
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/auth.TwoFAVerifyResponseDto"
                  - $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
      security:
        - JwtAuth: []
      summary: Verify 2FA (TOTP) code for user
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.LoginDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_auth.LoginResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Request Entity Too Large
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bruteforce.BlockResponse"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds until the login lockout expires.
              schema:
                type: integer
      summary: Login admin
      tags:
        - auth
  /api/v1/auth/password:
    put:
      operationId: putAuthPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.UpdatePasswordDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_Any"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Update user password
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.RefreshTokenDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_auth.LoginResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
      summary: Refresh access token
      tags:
        - auth
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.RegisterDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_auth.LoginResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      summary: Register new admin
      tags:
        - auth
  /api/v1/badge/{monitorId}/cert-exp:
    get:
      operationId: getBadgeByMonitorIdCertExp
      parameters:
        - description: Monitor ID
          in: path
          name: monitorId
          required: true
          schema:
            description: Monitor ID
            type: string
        - description: Badge style
          in: query
          name: style
          schema:
            description: Badge style
            type: string
        - description: Custom label
          in: query
          name: label
          schema:
            description: Custom label
            type: string
        - description: Days before expiry to show warning
          in: query
          name: warnDays
          schema:
