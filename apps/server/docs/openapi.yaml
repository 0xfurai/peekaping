  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
    JwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    ProbeAuth:
      bearerFormat: probe token
      scheme: bearer
      type: http
info:
  title: Peekaping API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/users:
    get:
      description: "Only an instance admin may do this: any other user and any API key get 403. Every user with their email, when they signed up and last signed in, whether their email is verified, whether they are an instance admin, whether they are disabled, whether they have 2FA on, and their workspaces with their role in each. q finds the users whose email contains it, ignoring case. The oldest user is first."
      operationId: getAdminUsers
      parameters:
        - description: Only users whose email contains this text, ignoring case
          in: query
          name: q
          schema:
            description: Only users whose email contains this text, ignoring case
            type: string
        - description: Page number, from 0
          in: query
          name: page
          schema:
            default: 0
            description: Page number, from 0
            format: int64
            minimum: 0
            type: integer
        - description: Users per page
          in: query
          name: limit
          schema:
            default: 20
            description: Users per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.UsersPageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: List the users of the install
      tags:
        - admin
  /api/v1/admin/users/{id}:
    delete:
      description: "Only an instance admin may do this. The user's memberships go with them. It is refused (409) for yourself, for the last instance admin, and while the user is the last owner of a workspace: that answer is {\"error\":{\"code\":\"LAST_OWNER\",\"workspaces\":[{\"id\",\"name\"}]}}, listing the workspaces whose only owner the user is. The other refusals answer with a message."
      operationId: deleteAdminUsersById
      parameters:
        - description: The user's ID
          in: path
          name: id
          required: true
          schema:
            description: The user's ID
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/admin.LastOwnerErrorResponse"
                  - $ref: "#/components/schemas/httpx.ErrorBody"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Delete a user
      tags:
        - admin
    patch:
      description: "Only an instance admin may do this. instanceAdmin gives or takes the instance admin flag: the last instance admin can't lose it (409). active false disables the user: they can't sign in, their sessions end at once and their workspaces keep running; an admin can't disable themselves (409). active true enables them again. A field left out stays as it is."
      operationId: patchAdminUsersById
      parameters:
        - description: The user's ID
          in: path
          name: id
          required: true
          schema:
            description: The user's ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin.UpdateUserDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Change a user
      tags:
        - admin
  /api/v1/admin/users/{id}/disable-2fa:
    post:
      description: Only an instance admin may do this. The user signs in with their password alone, and can set 2FA up again.
      operationId: postAdminUsersByIdDisable2fa
      parameters:
        - description: The user's ID
          in: path
          name: id
          required: true
          schema:
            description: The user's ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Turn off a user's 2FA
      tags:
        - admin
  /api/v1/admin/users/{id}/reset-link:
    post:
      description: "Only an instance admin may do this. The answer holds a single-use link to the web app's reset page, once: copy it to the user. It works without a sender for account emails, expires in an hour, and ends all the user's sessions when it is used."
      operationId: postAdminUsersByIdResetLink
      parameters:
        - description: The user's ID
          in: path
          name: id
          required: true
          schema:
            description: The user's ID
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.ResetLinkResponse"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Make a password reset link for a user
      tags:
        - admin
  /api/v1/admin/workspaces:
    get:
      description: "Only an instance admin may do this: any other user and any API key get 403. Every workspace with its name, when it was created, its owners' emails, how many members it has, how many monitors are active and paused, how many status pages and custom domains it has, and whether and why it is suspended (\"admin\" when an instance admin suspended it, \"unverified\" when it waits for its owner to verify their email address) and since when. Counts and metadata only: never a monitor's target, a channel or anything else inside a workspace. q finds the workspaces whose name or whose owner's email contains it, ignoring case. The oldest workspace is first."
      operationId: getAdminWorkspaces
      parameters:
        - description: Only workspaces whose name or whose owner's email contains this text, ignoring case
          in: query
          name: q
          schema:
            description: Only workspaces whose name or whose owner's email contains this text, ignoring case
            type: string
        - description: Page number, from 0
          in: query
          name: page
          schema:
            default: 0
            description: Page number, from 0
            format: int64
            minimum: 0
            type: integer
        - description: Workspaces per page
          in: query
          name: limit
          schema:
            default: 20
            description: Workspaces per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.WorkspacesPageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: List the workspaces of the install
      tags:
        - admin
  /api/v1/admin/workspaces/{id}:
    patch:
      description: "Only an instance admin may do this. suspended true suspends the workspace: its monitors stop running, its public status pages and badges answer 503 with the code STATUS_PAGE_UNAVAILABLE, and its members see that it is suspended. Nothing is deleted. suspended false resumes it: the monitors keep the state they had and run again, unless the workspace still waits for its owner to verify their email address, which is a hold of its own that resuming leaves. Suspending a suspended workspace, and resuming one that is not held by an admin, change nothing. suspended is required. The answer is the workspace as the list shows it."
      operationId: patchAdminWorkspacesById
      parameters:
        - description: The workspace's ID
          in: path
          name: id
          required: true
          schema:
            description: The workspace's ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin.UpdateWorkspaceDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_admin.WorkspaceResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Suspend or resume a workspace
      tags:
        - admin
  /api/v1/api-keys:
    get:
      operationId: getApiKeys
      parameters:
        - description: The workspace the request runs in. Without it, the user's default workspace, the one they joined first. An API key always runs in its own workspace.
          in: header
          name: X-Workspace-ID
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_Array_api_key.APIKeyResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Get API keys
      tags:
        - api_key
    post:
      operationId: postApiKeys
      parameters:
        - description: The workspace the request runs in. Without it, the user's default workspace, the one they joined first. An API key always runs in its own workspace.
          in: header
          name: X-Workspace-ID
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_key.CreateAPIKeyDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyWithTokenResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Create API key
      tags:
        - api_key
  /api/v1/api-keys/config:
    get:
      operationId: getApiKeysConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.ApiResponse_api_key.APIKeyConfigResponse"
          description: OK
      summary: Get API key configuration
      tags:
        - api_key
  /api/v1/api-keys/{id}:
    delete:
      operationId: deleteApiKeysById
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            description: API key ID
            type: string
        - description: The workspace the request runs in. Without it, the user's default workspace, the one they joined first. An API key always runs in its own workspace.
          in: header
          name: X-Workspace-ID
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      security:
        - JwtAuth: []
      summary: Delete API key
      tags:
        - api_key
    get:
      operationId: getApiKeysById
      parameters:
        - description: API key ID
          in: path
          name: id
