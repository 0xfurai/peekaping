  /api/v1/push/{token}:
    get:
      description: "Stores the push as the monitor's heartbeat. 404 when no monitor has the token, 400 when the monitor is paused, and 403 when the monitor's workspace is suspended (a new account's workspace is, until its owner verifies their email address, and an instance admin can suspend one) or when its type is turned off on this install (DISABLED_MONITOR_TYPES): the push is not stored and sends no notification."
      operationId: getPushByToken
      parameters:
        - description: Secret push token, authenticating the monitor.
          in: path
          name: token
          required: true
          schema:
            description: Secret push token, authenticating the monitor.
            type: string
        - description: Empty, up, or 1 means Up; other values mean Down.
          in: query
          name: status
          schema:
            description: Empty, up, or 1 means Up; other values mean Down.
            type: string
        - description: Heartbeat message; defaults to OK or Down.
          in: query
          name: msg
          schema:
            description: Heartbeat message; defaults to OK or Down.
            type: string
        - description: Response time in milliseconds; malformed values are ignored.
          in: query
          name: ping
          schema:
            description: Response time in milliseconds; malformed values are ignored.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthcheck.PushResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorBody"
          description: Internal Server Error
      summary: Send a heartbeat to a push monitor
      tags:
        - Push
