          minLength: 3
          type: string
        notification_ids:
          examples:
            - - 6830ad485361f19c598d6d90
          items:
            type: string
          type: array
        probe_ids:
          description: "The probes that run the monitor's checks, by id: one or more, none twice, and each must run the monitor's type. Omitted on create, the monitor runs on local; omitted on update, it keeps its probes. A push monitor runs on local only."
          examples:
            - - local
          items:
            type: string
          type:
