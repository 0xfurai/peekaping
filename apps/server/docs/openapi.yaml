          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - color
      type: object
    tag.Model:
      additionalProperties: false
      properties:
        color:
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type:
            - string
            - "null"
        id:
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - color
        - description
        - created_at
        - updated_at
      type: object
    tag.PartialUpdateDto:
      additionalProperties: true
      properties:
        color:
          examples:
            - "#3B82F6"
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          type:
            - string
            - "null"
        description:
          examples:
            - Production environment monitors
          type:
            - string
            - "null"
        name:
          examples:
            - Production
          maxLength: 100
          minLength: 1
          type:
            - string
            - "null"
      type: object
    telemetry.Features:
      additionalProperties: false
      properties:
        maintenance:
          description: Whether there is any maintenance window
          type: boolean
        metrics:
          description: Whether the Prometheus metrics endpoint is on
          type: boolean
        status_pages:
          description: Whether there is any status page
          type: boolean
      required:
        - status_pages
        - maintenance
        - metrics
      type: object
    telemetry.Payload:
      additionalProperties: false
      properties:
        db:
          description: "The storage backend: sqlite, postgres or mysql. Empty for a backend the ping doesn't report."
          examples:
            - sqlite
          type: string
        features:
          $ref: "#/components/schemas/telemetry.Features"
          description: Which features are on
        instance_id:
          description: The random instance ID; empty after an admin opts out, and while TELEMETRY forces the ping off and no ID was made before
          examples:
            - 6c1b4f0e-5d3a-4c8e-9f21-0a7b8c9d1e2f
          type: string
        mode:
          description: How the install runs
          enum:
            - single
            - cluster
          examples:
            - single
          type: string
        monitor_types:
          description: The distinct monitor types in use, lower case and sorted
          items:
            type: string
          type: array
        monitors:
          description: How many monitors there are, paused ones included, as a bucket
          enum:
            - "0"
            - 1-10
            - 11-50
            - 51-200
            - 201-1000
            - 1000+
          examples:
            - 1-10
          type: string
        notification_providers:
          description: The distinct notification channel types in use, lower case and sorted
          items:
            type: string
          type: array
        os:
          description: Operating system and architecture
          examples:
            - linux/arm64
          type: string
        version:
          description: The Peekaping version
          examples:
            - 0.0.47
          type: string
      required:
        - instance_id
        - version
        - mode
        - db
        - os
        - monitors
        - monitor_types
        - notification_providers
        - features
      type: object
    telemetry.StateResponse:
      additionalProperties: false
      properties:
        enabled:
          description: "Whether the usage ping is on: the admin's stored choice, which is on until they choose"
          type: boolean
        forced_off:
          description: Whether the TELEMETRY environment variable forces the ping off, whatever enabled says
          type: boolean
        notice_pending:
          description: "Whether the one-time notice that the usage ping and error reports are on by default is still to be shown: it is not yet dismissed, and the environment does not force both off"
          type: boolean
        payload:
          $ref: "#/components/schemas/telemetry.Payload"
          description: The exact JSON the next usage ping would send; its instance_id is empty after an admin opts out
      required:
        - enabled
        - forced_off
        - notice_pending
        - payload
      type: object
    telemetry.UpdateDto:
      additionalProperties: true
      properties:
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    utils.ApiResponse_Any:
      additionalProperties: false
