apiVersion: v2
name: peekaping
description: Peekaping in cluster mode, as api, web and probe deployments. The api replicas share the database and Redis, and the probes run the checks
# The release workflow sets both when it packages the chart
# (scripts/package-chart.sh): the version and the appVersion are the release,
# such as 0.0.48. An empty image.tag in values.yaml means the appVersion, so a
# published chart installs the images of its release. These values are for a
# checkout, whose images are `latest`.
version: 0.0.0
appVersion: latest
dependencies:
- name: redis
  version: 28.3.1
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: redis.enabled

- name: postgresql
  version: 18.12.14
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: postgresql.enabled
