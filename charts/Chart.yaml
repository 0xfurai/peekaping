apiVersion: v2
name: peekaping
description: Peekaping in cluster mode, as separate api, producer, worker, ingester and web deployments that talk through Redis
version: 1.0.0
dependencies:
- name: redis
  version: 28.3.1
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: redis.enabled

- name: postgresql
  version: 18.12.14
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: postgresql.enabled
