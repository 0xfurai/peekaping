apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
    {{- with .Values.config.env.METRICS_PORT }}
    - name: metrics
      port: {{ . | int }}
      targetPort: {{ . | int }}
    {{- end }}
