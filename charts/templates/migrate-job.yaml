{{- /*
A Job's pod template can't change once the Job exists, and this one changes on
every upgrade (the image tag, checksum/config). So each release revision gets
its own Job, <release>-migrate-<revision>. An install and an upgrade create a
new one, and Helm removes the previous revision's Job because it left the
manifest. A rollback re-applies the manifest of the revision it goes back to, so
it creates that revision's Job again.

Helm allows release names of up to 53 characters, and a Job's name can have 63.
So the name before the revision is cut to 52 characters, which leaves room for
a hyphen and 10 digits. A release name of up to 44 characters is not changed.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" .Release.Name | trunc 52 | trimSuffix "-" }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}

  template:
    metadata:
      labels:
        app: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- if .Values.migrate.apparmor.enabled }}
        container.apparmor.security.beta.kubernetes.io/{{ .Release.Name }}-migrate: runtime/default
        {{- end }}
    spec:
      restartPolicy: OnFailure

      serviceAccountName: {{ .Release.Name }}-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ .Release.Name }}-migrate
          image: {{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.config.existingSecret }}
            - secretRef:
                name: {{ .Values.config.existingSecret }}
            {{- end }}

          resources:
            requests:
              cpu: {{ .Values.migrate.resources.requests.cpu }}
              memory: {{ .Values.migrate.resources.requests.memory }}
            limits:
              cpu: {{ .Values.migrate.resources.limits.cpu }}
              memory: {{ .Values.migrate.resources.limits.memory }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop: ["ALL"]