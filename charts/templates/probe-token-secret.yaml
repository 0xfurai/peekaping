{{- if not .Values.probe.token.existingSecret }}
# The token of the local probe. The api stores it at startup (PROBE_BOOTSTRAP_TOKEN) and the
# probe pods send it (PROBE_TOKEN). To use a Secret of your own, set probe.token.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "peekaping.probeTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: probe
type: Opaque
data:
  PROBE_BOOTSTRAP_TOKEN: {{ include "peekaping.probeToken" . }}
{{- end }}
