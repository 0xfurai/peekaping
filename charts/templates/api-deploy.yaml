apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: {{ .Release.Name }}-api

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      
      {{- if .Values.api.apparmor.enabled }}
        container.apparmor.security.beta.kubernetes.io/{{ .Release.Name }}-api: runtime/default
        container.apparmor.security.beta.kubernetes.io/wait-for-migrations: runtime/default
      {{- end }}

    spec:
      # Run with a dedicated ServiceAccount (create below)
      serviceAccountName: {{ .Release.Name }}-sa
      automountServiceAccountToken: false

      # The api takes up to 30 seconds to shut down cleanly
      terminationGracePeriodSeconds: 35

      # Spread replicas across nodes/azs if possible
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-api

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Hold the pod until the migrate Job has applied every migration
      initContainers:
        {{- include "peekaping.waitForMigrations" . | nindent 8 }}

      containers:
        - name: {{ .Release.Name }}-api
          image: {{ include "peekaping.image" (dict "image" .Values.api.image "root" .) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.config.existingSecret }}
            - secretRef:
                name: {{ .Values.config.existingSecret }}
            {{- end }}

          env:
            # The local probe's token, which the api stores at startup. The probe pods send it.
            - name: PROBE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "peekaping.probeTokenSecretName" . }}
                  key: {{ include "peekaping.probeTokenSecretKey" . }}

          ports:
            - containerPort: {{ .Values.api.service.port }}
              name: http

          # Resource requests/limits to prevent noisy neighbor + OOM loops
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop: ["ALL"]

          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}

          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: {{ .Values.api.service.port }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}