# Bundled PostgreSQL and Redis (Bitnami subcharts). Both are off by default.
# They suit trying the chart. For production, leave both off and point
# config.env at an external PostgreSQL and Redis.
#
# Images: both run Bitnami's free images, registry-1.docker.io/bitnami/postgresql
# and .../redis. Bitnami's free repo no longer publishes version tags (they
# moved to bitnamilegacy/, which gets no updates). It has only `latest`, and
# `latest` floats: PostgreSQL's major version can change, and a new major does
# not start on an existing data directory. So the chart pins each image by the
# digest of the `latest` image it was tested with (the tag is then ignored).
# The digests below are PostgreSQL 18 and Redis 8, for amd64 and arm64.
#
# To move to newer images and subcharts, run scripts/update-chart-deps.sh. It
# lists what is behind, and --write updates the versions in Chart.yaml and the
# two digests below. It refuses an image with a new major version. To pin images
# of your own, set postgresql.image.digest and redis.image.digest in your
# values file. A major version change needs a dump and restore: the data of an
# older PostgreSQL does not start on a newer major version.
#
# helm uninstall keeps the PersistentVolumeClaims data-<release>-postgresql-0
# and redis-data-<release>-redis-master-0. Delete them to start with empty data.
#
# To try it: set enabled: true and uncomment the settings below, then
# uncomment DB_HOST to REDIS_PORT under config.env and create the secret
# described there. The example is for release `peekaping` in namespace
# `peekaping`.
postgresql:
  enabled: false
  image:
    digest: sha256:889db6427034525f50071945ddf808fbb77f8a52c2c8d3a7a75d39a167373566 # PostgreSQL 18.6.0
  # auth:
  #   username: peekaping
  #   password: peekaping
  #   database: peekaping

redis:
  enabled: false
  image:
    digest: sha256:33dbb7a4be39e73f0d5178e9040061ecb708946f55169657aa6897ba0a2c71d9 # Redis 8.10.2
  # Standalone avoids the subchart's default replicas.
  # architecture: standalone
  # auth:
  #   password: peekaping

# See docs for configuration details
# https://docs.peekaping.com/architecture/api-server
#
# config.env is rendered into a ConfigMap, so credentials go in existingSecret.
# Create it in the release's namespace. With the bundled databases it holds
# these keys, matching postgresql.auth and redis.auth above:
#   kubectl -n peekaping create secret generic peekaping-config \
#     --from-literal=DB_USER=peekaping --from-literal=DB_PASS=peekaping \
#     --from-literal=DB_NAME=peekaping --from-literal=REDIS_PASSWORD=peekaping
# An external PostgreSQL and Redis use the same keys with your own values.
config:
  existingSecret: "peekaping-config"
  env:
    DB_TYPE: "postgres"
    # Bundled service hosts: <release>-postgresql and <release>-redis-master in
    # the release's namespace (here release and namespace are both "peekaping").
    # For an external PostgreSQL and Redis, set your own hosts and ports.
    # DB_HOST: "peekaping-postgresql.peekaping.svc.cluster.local"
    # DB_PORT: "5432"
    # REDIS_HOST: "peekaping-redis-master.peekaping.svc.cluster.local"
    # REDIS_PORT: "6379"
    # Redis ACL username. Optional: set it for a Redis ACL user, omit it for password-only/default user auth.
    # Keep REDIS_PASSWORD in the existingSecret, not here: this map is rendered into a ConfigMap.
    # REDIS_USERNAME: "peekaping"
    # Serve the unauthenticated Prometheus /metrics endpoint on the API port (off by default).
    # METRICS_ENABLED: "true"

api:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8034
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    path: /api/v1/health
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    startup:
      failureThreshold: 30
      periodSeconds: 2

ingester:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-ingester
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

producer:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-producer
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

worker:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Pod sysctls. ping_group_range lets the non-root worker send ICMP echo
  # requests for ping monitors without the NET_RAW capability. Kubernetes
  # allows it as a safe sysctl. Set to [] to leave the node default.
  sysctls:
    - name: net.ipv4.ping_group_range
      value: "0 2147483647"

web:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  probes:
    path: /
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5

migrate:
  # Retries double their delay (10 s, 20 s, 40 s, ...): 6 tries outlast a bundled PostgreSQL restart; activeDeadlineSeconds caps the total.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  apparmor:
    enabled: false
  image:
    repository: 0xfurai/peekaping-migrate
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  # ingressClassName: "alb"
  # namespace: "istio-system"
  # host: "mydomain.com"
  # annotations:
  #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/my-certificate-arn
  #   alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
  #   alb.ingress.kubernetes.io/healthcheck-port: status-port
  #   alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
