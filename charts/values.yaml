  #   alb.ingress.kubernetes.io/scheme: internal
  #   alb.ingress.kubernetes.io/ssl-redirect: "443"
  #   alb.ingress.kubernetes.io/target-type: ip


istio:
  ingress:
    name: istio-ingressgateway
    port: 80
  gateway:
    enabled: false
    selector: ingressgateway
    port: 80
    protocol: HTTP
    name: http
  virtualservice:
    enabled: false
