# Codecov's defaults fail the project check on any drop at all, which upload
# noise trips. A drop of up to 1% passes; new lines need 70% coverage.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        # A PR runs only the critical API tests (.github/workflows/test.yml), so its coverage is
        # lower than main's full run. The checks report, but don't fail
        informational: true
    patch:
      default:
        target: 70%
        informational: true

# Each workflow uploads under its own flag. The MongoDB import and Integration
# tests workflows run only when apps/server changes, so a web-only PR has one
# upload where main has three;
# carryforward reuses the base commit's report for a flag the PR didn't upload.
flag_management:
  default_rules:
    carryforward: true
