# Test-only overlay for the Playwright suite. It adds `e2e-target`, the local
# service e2e monitors check and notify (e2e/fake-target/server.mjs), and
# Mailpit, a mail catcher. Use it on top of any dev, single or cluster compose file:
#
#   docker compose -f docker-compose.dev.sqlite.yml -f docker-compose.e2e.yml up -d
#
# Both join `appnet` (dev and cluster stacks) and the default network (single
# stacks), so monitors reach the target at http://e2e-target:3033 and the
# install reaches Mailpit at mailpit:1025 either way.
#
# Mailpit catches the mail of whatever sender sends to mailpit:1025: the one the
# cloud suite sets in the environment (ACCOUNT_SMTP_HOST=mailpit, with
# SIGNUP_MODE=open, for e2e/onboarding.spec.ts), or the one e2e/admin-settings.spec.ts
# saves in Admin → Settings and removes again. The tests read it through its
# HTTP API on localhost:8025 (E2E_MAILPIT_URL).
networks:
  appnet:

services:
  e2e-target:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./e2e/fake-target:/srv:ro
    ports:
      - "${E2E_TARGET_PORT:-3033}:3033"
    networks:
      - default
      - appnet
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:3033/health"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 30s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    # Loopback only: Mailpit's API needs no sign-in, and the mail it catches
    # holds reset links. SMTP isn't published; the install reaches it inside
    # the network.
    ports:
      - "127.0.0.1:${E2E_MAILPIT_PORT:-8025}:8025"
    networks:
      - default
      - appnet
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 30s
      start_interval: 1s
