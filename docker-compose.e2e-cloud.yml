# Overlay for the e2e suite of an open-signup install (e2e/onboarding.spec.ts). It adds Mailpit, a
# mail catcher: the api sends its account emails and install email notifications to mailpit:1025,
# and the tests read them through its HTTP API on localhost:8025 (E2E_MAILPIT_URL).
# Use it on top of a dev stack and the e2e overlay, with the sender set in .env:
#
#   SIGNUP_MODE=open
#   ACCOUNT_SMTP_HOST=mailpit
#   ACCOUNT_SMTP_PORT=1025
#   ACCOUNT_SMTP_FROM=peekaping@e2e.test
#   ACCOUNT_SMTP_TLS=none
#
#   COMPOSE_FILE=docker-compose.dev.sqlite.yml:docker-compose.e2e.yml:docker-compose.e2e-cloud.yml
networks:
  appnet:

services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${E2E_MAILPIT_PORT:-8025}:8025"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 30s
      start_interval: 1s
