name: nexus-runner diagnostics (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/nexus-diag.yml'

jobs:
  diag:
    runs-on: nexus-runner
    timeout-minutes: 20
    steps:
      - name: tmpfs
        run: |
          set -x
          sudo -n true && echo "sudo works" || echo "no sudo"
          sudo -n mkdir -p /mnt/ram && sudo -n mount -t tmpfs -o size=2g,mode=1777 tmpfs /mnt/ram && df -h /mnt/ram || echo "no tmpfs mount"
          sudo -n mount -o remount,size=2g /dev/shm && df -h /dev/shm || echo "no /dev/shm remount"
          cat /proc/self/status | grep -i cap
