name: Test MongoDB import

# bun db import-mongo copies a MongoDB install into SQLite or PostgreSQL. Its tests
# seed a real MongoDB with raw documents in the format the Mongo repositories wrote,
# import into both kinds of SQL database and read the result back, so they need a
# MongoDB and a PostgreSQL server. The Test and Lint workflow has neither, and those
# tests skip there.

on:
  pull_request:
    paths:
      - 'apps/server/**'
      - '.github/workflows/test-import-mongo.yml'
    branches: [ main, master ]
  push:
    paths:
      - 'apps/server/**'
      - '.github/workflows/test-import-mongo.yml'
    branches: [ main, master ]

# A new push to a PR replaces its run in progress, which would otherwise keep
# its runners busy testing a commit nobody waits for. Other runs get a group of
# their own: a shared one would cancel the queued runs of busy pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  import-mongo:
    runs-on: nexus-runner

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PEE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      PEE_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Run the import tests with coverage
        working-directory: apps/server
        run: |
          # A failing go test must fail the step: without pipefail, the exit status of the
          # pipeline would be tee's
          set -o pipefail
          # -count=1 so that a cached result never stands in for a run against the databases.
          # -run TestImport picks the import tests of the three packages, which skip in the Test and
          # Lint workflow. -coverpkg credits the code they reach in other packages, as there, and
          # the bun command, whose code the other workflow doesn't instrument.
          go test -timeout 300s -count=1 -v -run TestImport -coverprofile=coverage.txt -coverpkg=./internal/...,./cmd/bun/... ./internal/mongoimport/... ./cmd/bun/ ./internal/apitest/ | tee import-test.log
          # These tests skip when they can't reach a database, which would leave this job green without running them
          if grep -q -e '--- SKIP' import-test.log; then
            echo 'A test skipped: the MongoDB or PostgreSQL service was not reachable'
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 0xfurai/peekaping
          file: apps/server/coverage.txt
          flags: import-mongo
