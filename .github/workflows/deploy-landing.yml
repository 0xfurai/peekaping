name: Deploy Landing

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
      - '.github/workflows/deploy-site-reusable.yml'
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
      - '.github/workflows/deploy-site-reusable.yml'
  workflow_dispatch:

jobs:
  landing:
    uses: ./.github/workflows/deploy-site-reusable.yml
    with:
      app: landing
    permissions:
      contents: read
      pull-requests: write # preview URL comment
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
