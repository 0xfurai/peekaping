name: Test and Lint

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
  push:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
    tags:
      - 'v*'

# A new push to a PR replaces its run in progress, which would otherwise keep
# its runners busy testing a commit nobody waits for. Other runs get a group of
# their own: a shared one would cancel the queued runs of busy pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Check OpenAPI and generated client
        run: bun run api:check

      - name: Run web lint
        working-directory: apps/web
        run: bun run lint

      - name: Run web tests
        working-directory: apps/web
        run: bun run test

      - name: Run web build
        working-directory: apps/web
        run: bun run build

      - name: Run server tests with coverage
        working-directory: apps/server
        run: |
          pwd
          # -coverpkg credits code that tests in other packages reach, such as
          # the controllers internal/apitest drives through the router. The timeout
          # is per package: internal/apitest runs its tests one at a time, and with
          # coverage it takes about two minutes on its own
          go test -timeout 300s -v -coverprofile=coverage.txt -coverpkg=./internal/... ./internal/... ./cmd/...

      # The slim probe leaves out the executors of five monitor types (Dockerfile.probe, GO_TAGS=slim)
      - name: Run slim probe tests
        working-directory: apps/server
        run: go test -timeout 120s -tags slim ./internal/probeclient/ ./internal/modules/healthcheck/executor/ ./cmd/probe/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 0xfurai/peekaping
          file: apps/server/coverage.txt
          flags: server


