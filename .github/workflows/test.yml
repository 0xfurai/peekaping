name: Test and Lint

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
  push:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
    tags:
      - 'v*'
  # Nightly, for the race job, which runs only here and when started by hand, and for
  # flaky tests. The other test workflows run at the same time
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A new push to a PR replaces its run in progress, which would otherwise keep
# its runners busy testing a commit nobody waits for. Other runs get a group of
# their own: a shared one would cancel the queued runs of busy pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The repository tests run their PostgreSQL subtests only when PEE_TEST_POSTGRES_DSN is set.
    # Each test creates a schema or database of its own, so they share this one server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PEE_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Run go vet
        working-directory: apps/server
        run: go vet ./...

      # The version is pinned: a new release adds checks that fail PRs nobody touched.
      # Config and the linters still off, with their tickets: apps/server/.golangci.yml
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/server

      - name: Check OpenAPI and generated client
        run: bun run api:check

      - name: Run web lint
        working-directory: apps/web
        run: bun run lint

      - name: Run web tests
        working-directory: apps/web
        run: bun run test

      - name: Run web build
        working-directory: apps/web
        run: bun run build

      - name: Run server tests with coverage
        working-directory: apps/server
        env:
          # The API tests a PR runs: workspace isolation, auth and sessions, API keys, the API
          # contract, monitor CRUD and the private-address block. About 100 of the ~670
          CRITICAL_API_TESTS: '^(TestIsolation|TestAuthAPI|TestMe|TestAPIKeyWorkspace|TestOpenAPI|TestHTTPContract|TestRouteTable|TestMonitorsAPI|TestBlockPrivateTargets)(_|$)'
        run: |
          pwd
          # A failing go test must fail the step: without pipefail, the exit status of the
          # pipeline would be tee's
          set -o pipefail
          # -coverpkg credits code that tests in other packages reach, such as
          # the controllers internal/apitest drives through the router, and the Go
          # migrations in cmd/bun/migrations that tests in other packages run. The timeout
          # is per package, and internal/apitest is the slowest one. -count=1 so that a cached
          # result never stands in for a run against the PostgreSQL service. -parallel 4: the
          # API tests run in parallel, four at a time, as many as a GitHub-hosted runner has CPUs
          flags="-timeout 1200s -count=1 -parallel 4 -v -coverpkg=./internal/...,./cmd/bun/migrations"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # A PR runs every other package's tests, and of the API tests only the critical set
            # (CRITICAL_API_TESTS). All of them run after merge and nightly
            go test $flags -coverprofile=coverage.txt $(go list ./internal/... ./cmd/... | grep -v '/internal/apitest$') | tee server-test.log
            go test $flags -coverprofile=coverage-api.txt -run "$CRITICAL_API_TESTS" ./internal/apitest/ | tee -a server-test.log
            # One profile for the upload: the second one without its mode line
            tail -n +2 coverage-api.txt >> coverage.txt
          else
            go test $flags -coverprofile=coverage.txt ./internal/... ./cmd/... | tee server-test.log
          fi
          # Every PostgreSQL subtest skips with this message when the variable is unset, which
          # would leave this job green without running them
          if grep -q 'set PEE_TEST_POSTGRES_DSN' server-test.log; then
            echo 'A PostgreSQL test skipped: PEE_TEST_POSTGRES_DSN is not set'
            exit 1
          fi

      # The slim probe leaves out the executors of five monitor types (Dockerfile.probe, GO_TAGS=slim)
      - name: Run slim probe tests
        working-directory: apps/server
        run: go test -timeout 120s -tags slim ./internal/probeclient/ ./internal/modules/healthcheck/executor/ ./cmd/probe/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 0xfurai/peekaping
          file: apps/server/coverage.txt
          flags: server

  # The race detector slows the tests down several times over: internal/apitest alone takes
  # about 25 minutes under -race. So it runs only nightly and when started by hand, not on
  # PRs or pushes to main
  race:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The same PostgreSQL as the test job, so its subtests run under the race detector too
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PEE_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Run server tests with the race detector
        working-directory: apps/server
        # On the GitHub-hosted runners internal/apitest alone takes 1395 to 1491 seconds under
        # -race, and it hit a 1800 second timeout once with nothing hung, so the per-package
        # timeout leaves room for a slower run. -count=1 as in the test job
        run: go test -race -timeout 3000s -count=1 -parallel 4 ./internal/... ./cmd/...



  # The API tests again with the settings of Peekaping Cloud (PEE_TEST_CLOUD=1, cloudConfig in
  # internal/apitest/cloud_test.go), which the guards of the cloud add to as they land. The test job
  # runs the same tests with the self-host defaults. PostgreSQL is there for the isolation suite's
  # PostgreSQL run. No coverage: the test job has it. It runs after merge and nightly, not on PRs:
  # it is the whole API suite a second time
  api-cloud:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PEE_TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable
      PEE_TEST_CLOUD: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Run API tests with the cloud's settings
        working-directory: apps/server
        # internal/apitest takes more than five minutes now
        run: go test -timeout 1200s -count=1 -parallel 4 ./internal/apitest/...
