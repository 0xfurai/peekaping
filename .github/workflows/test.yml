name: Test and Lint

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
  push:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.github/workflows/test.yml'
      - 'scripts/check-api-artifacts.sh'
      - 'redocly.yaml'
      - '!**/*.md'
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Install dependencies
        working-directory: apps/server
        run: go mod download

      - name: Check OpenAPI and generated client
        run: bun run api:check

      - name: Run web lint
        working-directory: apps/web
        run: bun run lint

      - name: Run web tests
        working-directory: apps/web
        run: bun run test

      - name: Run web build
        working-directory: apps/web
        run: bun run build

      - name: Run server tests with coverage
        working-directory: apps/server
        run: |
          pwd
          # -coverpkg credits code that tests in other packages reach, such as
          # the controllers internal/apitest drives through the router
          go test -timeout 120s -v -coverprofile=coverage.txt -coverpkg=./internal/... ./internal/... ./cmd/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 0xfurai/peekaping
          file: apps/server/coverage.txt


