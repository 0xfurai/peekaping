name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/deploy-site-reusable.yml'
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/deploy-site-reusable.yml'
  workflow_dispatch:

jobs:
  docs:
    uses: ./.github/workflows/deploy-site-reusable.yml
    with:
      app: docs
    permissions:
      contents: read
      pull-requests: write # preview URL comment
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
