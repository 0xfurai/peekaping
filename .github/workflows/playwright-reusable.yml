name: Reusable Playwright Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout in minutes for the test job'
        required: false
        type: number
        default: 300
      container-tag:
        description: 'Container tag to test (e.g., latest, 1.2.3-rc.1)'
        required: false
        type: string
        default: 'latest'

jobs:
  playwright-tests:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
    env:
      # Every docker compose command below runs the stack plus the e2e target.
      COMPOSE_FILE: docker-compose.test.${{ matrix.database }}.yml:docker-compose.e2e.yml
      # The probe image the remote probe specs run, published with the other images of this tag.
      E2E_PROBE_IMAGE: 0xfurai/peekaping-probe:${{ inputs.container-tag }}
    steps:
    # prepare environment and dependencies
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps chromium

    # prepare services
    - name: Create .env file
      run: |
        cat > .env << EOF
        # Database Configuration
        DB_TYPE=${{ matrix.database }}
        DB_HOST=database
        DB_PORT=${{ matrix.database == 'postgres' && '5432' }}
        DB_NAME=${{ matrix.database == 'sqlite' && '/app/data/peekaping.db' || 'peekaping' }}
        DB_USER=${{ matrix.database == 'postgres' && 'peekaping' || 'root' }}
        DB_PASS=password

        REDIS_HOST="redis"
        REDIS_PORT=6379
        REDIS_PASSWORD=""
        REDIS_DB=0

        # The shortest time before a remote probe that stopped is reported offline (default 3m).
        PROBE_OFFLINE_AFTER=2m

        # The local probe's token: the api stores it and the stack's probe service sends it. The
        # SQLite and PostgreSQL compose files refuse to start without it.
        PROBE_BOOTSTRAP_TOKEN=e2e-local-probe-token-0123456789abcdef0123456789

        # Server Configuration
        CLIENT_URL=http://localhost:8383
        SERVER_PORT=8034
        BUNDEBUG=2
        MODE=prod # logging
        TZ="America/New_York"

        # The usage ping and error reports are on by default. A test run must not send either to
        # Peekaping, so both point at an address nothing listens on. The DSN must not be empty:
        # an empty one means Peekaping's own Sentry project.
        TELEMETRY_URL=http://127.0.0.1:9/v1/ping
        ERROR_REPORTING_DSN=http://public@127.0.0.1:9/1
        EOF

    - name: Update docker-compose file with container tag
      run: |
        # Create a temporary docker-compose file with the specified container tag
        cp docker-compose.prod.${{ matrix.database }}.yml docker-compose.test.${{ matrix.database }}.yml

        # Replace container tags with the specified version
        sed -i 's|0xfurai/peekaping-api:latest|0xfurai/peekaping-api:${{ inputs.container-tag }}|g' docker-compose.test.${{ matrix.database }}.yml
        sed -i 's|0xfurai/peekaping-probe:latest|0xfurai/peekaping-probe:${{ inputs.container-tag }}|g' docker-compose.test.${{ matrix.database }}.yml
        sed -i 's|0xfurai/peekaping-web:latest|0xfurai/peekaping-web:${{ inputs.container-tag }}|g' docker-compose.test.${{ matrix.database }}.yml
        sed -i 's|0xfurai/peekaping-migrate:latest|0xfurai/peekaping-migrate:${{ inputs.container-tag }}|g' docker-compose.test.${{ matrix.database }}.yml

        echo "=== Modified docker-compose file ==="
        cat docker-compose.test.${{ matrix.database }}.yml

    - name: Start services
      run: |
        if ! docker compose up -d; then
          echo "=== Service startup failed! Showing container logs ==="
          docker compose ps
          echo "=== Container Logs ==="
          docker compose logs
          echo "=== Individual Service Logs ==="
          docker compose logs migrate || echo "No migrate service logs"
          docker compose logs api || echo "No api service logs"
          docker compose logs probe || echo "No probe service logs"
          docker compose logs web || echo "No web service logs"
          docker compose logs gateway || echo "No gateway service logs"
          exit 1
        fi

    # The remote probe specs start this image themselves, on the stack's network. Pulled here so
    # that a pull failure fails this step.
    - name: Pull the probe image
      run: docker pull "$E2E_PROBE_IMAGE"

    - name: Show container logs
      run: |
        echo "=== Container Status ==="
        docker compose ps
        echo "=== Container Logs ==="
        docker compose logs

    - name: Wait for services to be ready
      run: |
        if ! timeout 120 bash -c "until curl -sf http://localhost:8383/api/v1/health && curl -sf http://localhost:3033/health; do sleep 2; done" >/dev/null; then
          echo "::error::The stack wasn't healthy after 120 seconds"
          docker compose ps
          docker compose logs
          exit 1
        fi
        echo "The stack is healthy"

    - name: Run Playwright tests
      run: bunx playwright test

    - name: Stop services
      if: always()
      run: docker compose down

    - name: Cleanup temporary docker-compose file
      if: always()
      run: rm -f docker-compose.test.${{ matrix.database }}.yml

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.database }}-${{ inputs.container-tag }}
        path: playwright-report/
        retention-days: 30

  playwright-tests-bundle:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
    # prepare environment and dependencies
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps chromium

    # prepare data directories
    - name: Create data directories
      run: |
        mkdir -p ./test-data/${{ matrix.database }}
        case "${{ matrix.database }}" in
          sqlite)
            # SQLite data directory
            mkdir -p ./test-data/sqlite/app
            ;;
          postgres)
            # PostgreSQL data directory
            mkdir -p ./test-data/postgres/data
            ;;
        esac

    - name: Check bundle image availability and determine tag
      id: bundle_tag
      run: |
        # Try to pull the specific tag first
        BUNDLE_TAG="${{ inputs.container-tag }}"
        IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-bundle-${{ matrix.database }}"

        echo "Checking if ${IMAGE_NAME}:${BUNDLE_TAG} exists..."

        if docker manifest inspect "${IMAGE_NAME}:${BUNDLE_TAG}" >/dev/null 2>&1; then
          echo "✅ Found bundle image with tag: ${BUNDLE_TAG}"
          echo "tag=${BUNDLE_TAG}" >> $GITHUB_OUTPUT
        elif docker manifest inspect "${IMAGE_NAME}:latest" >/dev/null 2>&1; then
          echo "⚠️  Specific tag not found, falling back to latest"
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          echo "❌ No bundle image found for ${{ matrix.database }}"
          echo "Available tags:"
          docker search --limit 5 "${{ github.repository_owner }}/${{ github.event.repository.name }}-bundle-${{ matrix.database }}" || echo "No public images found"
          exit 1
        fi

    # The remote probe specs start this image themselves, at the tag the bundle is tested at.
    # Pulled here so that a pull failure fails this step.
    - name: Pull the probe image
      run: docker pull "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-probe:${{ steps.bundle_tag.outputs.tag }}"

    - name: Start the e2e target
      run: |
        docker network create peekaping-e2e
        docker run -d --name e2e-target --network peekaping-e2e -p 3033:3033 \
          -v "$(pwd)/e2e/fake-target:/srv:ro" \
          node:22-alpine node /srv/server.mjs

    - name: Start bundle container - ${{ matrix.database }}
      run: |
        BUNDLE_TAG="${{ steps.bundle_tag.outputs.tag }}"
        echo "Starting bundle container with tag: ${BUNDLE_TAG}"

        # Common environment variables for all database types
        COMMON_ENV=(
          -e CLIENT_URL=http://localhost:8383
          # On by default, and a test run must not send to Peekaping: point both at nothing
          -e TELEMETRY_URL=http://127.0.0.1:9/v1/ping
          -e ERROR_REPORTING_DSN=http://public@127.0.0.1:9/1
          # The shortest time before a remote probe that stopped is reported offline (default 3m).
          -e PROBE_OFFLINE_AFTER=2m
        )

        case "${{ matrix.database }}" in
          sqlite)
            docker run -d \
              --name peekaping-bundle-test-${{ matrix.database }} \
              --network peekaping-e2e \
              -p 8383:8383 \
              -v $(pwd)/test-data/sqlite/app:/app/data \
              "${COMMON_ENV[@]}" \
              -e DB_NAME=/app/data/peekaping.db \
              ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-bundle-${{ matrix.database }}:${BUNDLE_TAG}
            ;;
          postgres)
            docker run -d \
              --name peekaping-bundle-test-${{ matrix.database }} \
              --network peekaping-e2e \
              -p 8383:8383 \
              -v $(pwd)/test-data/postgres/data:/var/lib/postgresql/data \
              "${COMMON_ENV[@]}" \
              -e DB_NAME=peekaping \
              -e DB_USER=peekaping \
              -e DB_PASS=password \
              ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-bundle-${{ matrix.database }}:${BUNDLE_TAG}
            ;;
        esac

    - name: Show container logs
      run: |
        echo "=== Container Status ==="
        docker ps --filter "name=peekaping-bundle-test-${{ matrix.database }}"
        echo "=== Container Logs ==="
        docker logs peekaping-bundle-test-${{ matrix.database }}
        echo "=== Container Environment ==="
        docker exec peekaping-bundle-test-${{ matrix.database }} env | grep -E "(DB_|API_|JWT_|ACCESS_|REFRESH_|BUNDEBUG)" || echo "No relevant env vars found"
        echo "=== Container Processes ==="
        docker top peekaping-bundle-test-${{ matrix.database }} || echo "Could not list processes"
        echo "=== Testing port 8383 ==="
        curl -sS http://localhost:8383/api/v1/health || echo "The API isn't answering on port 8383 yet"

    - name: Wait for bundle service to be ready
      run: |
        if ! timeout 120 bash -c "until curl -sf http://localhost:8383/api/v1/health && curl -sf http://localhost:3033/health; do sleep 2; done" >/dev/null; then
          echo "::error::The bundle wasn't healthy after 120 seconds"
          docker ps --filter "name=peekaping-bundle-test-${{ matrix.database }}"
          docker logs peekaping-bundle-test-${{ matrix.database }}
          docker logs e2e-target
          exit 1
        fi
        echo "The bundle is healthy"

    # The bundle and the e2e target run with plain docker, not compose, so the specs can't find
    # their network: the probe container joins peekaping-e2e and reaches the bundle by its name.
    - name: Run Playwright tests against bundle
      run: PLAYWRIGHT_BASE_URL=http://localhost:8383 bunx playwright test
      env:
        E2E_PROBE_NETWORK: peekaping-e2e
        E2E_PROBE_URL: http://peekaping-bundle-test-${{ matrix.database }}:8383
        E2E_PROBE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-probe:${{ steps.bundle_tag.outputs.tag }}

    # The single-mode bundles' user, ports and shutdown, on the published image
    - name: Test the bundle's user, ports and shutdown
      run: |
        scripts/test-bundle-user.sh ${{ matrix.database }} \
          ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-bundle-${{ matrix.database }}:${{ steps.bundle_tag.outputs.tag }}

    - name: Show final container logs on failure
      if: failure()
      run: |
        echo "=== Final Container Status ==="
        docker ps --filter "name=peekaping-bundle-test-${{ matrix.database }}"
        echo "=== Final Container Logs ==="
        docker logs peekaping-bundle-test-${{ matrix.database }}
        echo "=== Final Container Environment ==="
        docker exec peekaping-bundle-test-${{ matrix.database }} env | grep -E "(DB_|API_|JWT_|ACCESS_|REFRESH_|BUNDEBUG)" || echo "No relevant env vars found"
        echo "=== Final Container Processes ==="
        docker top peekaping-bundle-test-${{ matrix.database }} || echo "Could not list processes"
        echo "=== Final port 8383 test ==="
        curl -sS http://localhost:8383/api/v1/health || echo "The API isn't answering on port 8383"

    - name: Stop bundle container
      if: always()
      run: |
        docker stop peekaping-bundle-test-${{ matrix.database }} || true
        docker rm peekaping-bundle-test-${{ matrix.database }} || true
        docker rm -f e2e-target || true
        docker network rm peekaping-e2e || true

    - name: Cleanup test data
      if: always()
      run: sudo rm -rf ./test-data

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-bundle-${{ matrix.database }}-${{ inputs.container-tag }}
        path: playwright-report/
        retention-days: 30
