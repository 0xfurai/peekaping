name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.dockerignore'
      - 'docker-compose.dev.*.yml'
      - 'docker-compose.bundle.*.yml'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.bundle.*'
      - 'startup.bundle.*.sh'
      - 'supervisord.bundle.*.conf'
      - 'scripts/test-bundle-user.sh'
      - 'Caddyfile'
      - '.github/workflows/playwright.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.dockerignore'
      - 'docker-compose.dev.*.yml'
      - 'docker-compose.bundle.*.yml'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.bundle.*'
      - 'startup.bundle.*.sh'
      - 'supervisord.bundle.*.conf'
      - 'scripts/test-bundle-user.sh'
      - 'Caddyfile'
      - '.github/workflows/playwright.yml'
      - '!**/*.md'
    branches: [ main, master ]

env:
  # Compose names the images it builds <project>-<service>. Pinning the project
  # name makes the images from build-images match what the compose files expect.
  COMPOSE_PROJECT_NAME: peekaping

jobs:
  # Build each image once, on its own runner, and share it with the test jobs.
  # The dev images don't depend on the database, so all three dev jobs reuse them.
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dev-api, tag: peekaping-api, context: apps/server, file: apps/server/infra/Dockerfile.api }
          - { name: dev-producer, tag: peekaping-producer, context: apps/server, file: apps/server/infra/Dockerfile.producer }
          - { name: dev-worker, tag: peekaping-worker, context: apps/server, file: apps/server/infra/Dockerfile.worker }
          - { name: dev-ingester, tag: peekaping-ingester, context: apps/server, file: apps/server/infra/Dockerfile.ingester }
          - { name: dev-migrate, tag: peekaping-migrate, context: apps/server, file: apps/server/infra/Dockerfile.migrate }
          - { name: dev-web, tag: peekaping-web, context: ., file: apps/web/Dockerfile }
          - { name: bundle-postgres, tag: peekaping-peekaping, context: ., file: Dockerfile.bundle.postgres }
          - { name: bundle-mongo, tag: peekaping-peekaping, context: ., file: Dockerfile.bundle.mongo }
          - { name: bundle-sqlite, tag: peekaping-peekaping, context: ., file: Dockerfile.bundle.sqlite }
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build ${{ matrix.name }} image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        tags: ${{ matrix.tag }}
        outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
        cache-from: type=gha,scope=e2e-${{ matrix.name }}
        cache-to: type=gha,scope=e2e-${{ matrix.name }},mode=max
    - uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.name }}
        path: ${{ runner.temp }}/${{ matrix.name }}.tar
        retention-days: 1
        # Image layers are already compressed.
        compression-level: 0

  # How the single-mode bundles run: the user, PUID/PGID, the Docker socket,
  # port 8383, ping and Docker monitors, docker run --user and docker stop.
  bundle-user:
    name: Bundle user ${{ matrix.database }}
    needs: build-images
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
    - uses: actions/checkout@v4
    - name: Download image
      uses: actions/download-artifact@v4
      with:
        name: image-bundle-${{ matrix.database }}
        path: ${{ runner.temp }}/images
    - name: Load image
      run: docker load --input "$RUNNER_TEMP/images/bundle-${{ matrix.database }}.tar"
    - name: Test the bundle's user, ports and shutdown
      run: scripts/test-bundle-user.sh ${{ matrix.database }} peekaping-peekaping

  playwright-tests:
    name: E2E ${{ matrix.config }} ${{ matrix.database }}
    needs: build-images
    # Run every combination whose images built, even if another image failed.
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mongo, sqlite]
        config: [dev, bundle]
    env:
      # Every docker compose command below runs the stack plus the e2e target.
      COMPOSE_FILE: docker-compose.${{ matrix.config }}.${{ matrix.database }}.yml:docker-compose.e2e.yml
    steps:
    # Prepare environment and dependencies
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps chromium
    - name: Download images
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ matrix.config == 'dev' && 'image-dev-*' || format('image-bundle-{0}', matrix.database) }}
        path: ${{ runner.temp }}/images
        merge-multiple: true
    - name: Load images
      run: |
        for image in "$RUNNER_TEMP"/images/*.tar; do
          docker load --input "$image"
        done

    # Prepare environment file
    - name: Create .env file
      run: |
        cat > .env << EOF
        # Database Configuration
        DB_TYPE=${{ matrix.database }}
        DB_HOST=database
        DB_PORT=${{ matrix.database == 'postgres' && '5432' || matrix.database == 'mongo' && '27017' }}
        DB_NAME=${{ matrix.database == 'sqlite' && '/app/data/peekaping.db' || 'peekaping' }}
        DB_USER=${{ matrix.database == 'postgres' && 'peekaping' || matrix.database == 'mongo' && 'root' || 'root' }}
        DB_PASS=password

        REDIS_HOST="redis"
        REDIS_PORT=6379
        REDIS_PASSWORD=""
        REDIS_DB=0

        # Server Configuration
        CLIENT_URL=http://localhost:8383
        SERVER_PORT=8034
        BUNDEBUG=2
        EOF

    # Create and prepare data directories with proper permissions
    - name: Prepare data directories
      run: |
        mkdir -p .data/postgres .data/mongodb .data/logs .data/caddy-data .data/caddy-config
        sudo chown -R 999:999 .data/postgres .data/logs  # postgres user is typically uid 999
        sudo chown -R 999:999 .data/mongodb              # mongodb user is typically uid 999
        sudo chmod -R 755 .data/logs
        sudo chmod -R 700 .data/postgres
        sudo chmod -R 755 .data/mongodb
        ls -la .data/
        echo "Directory permissions set successfully"

    # Start services from the prebuilt images using appropriate docker-compose file
    - name: Start services with docker-compose
      run: docker compose up -d --no-build

    - name: Show container logs
      run: |
        echo "=== Container Status ==="
        docker compose ps
        echo "=== Container Logs ==="
        docker compose logs

    - name: Wait for services to be ready
      run: |
        HEALTH_URL="http://localhost:${{ matrix.config == 'bundle' && '8383' || '8034' }}/api/v1/health"
        if ! timeout 120 bash -c "until curl -sf $HEALTH_URL && curl -sf http://localhost:8383/ && curl -sf http://localhost:3033/health; do sleep 2; done" >/dev/null; then
          echo "::error::The stack wasn't healthy after 120 seconds"
          docker compose ps
          docker compose logs
          exit 1
        fi
        echo "The stack is healthy"

    - name: Run Playwright tests
      run: bunx playwright test

    # The suite must also pass on the database the first run left behind.
    - name: Run Playwright tests again on the same database
      run: bunx playwright test
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-rerun

    - name: Show container logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs

    - name: Stop services
      if: always()
      run: docker compose down

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.config }}-${{ matrix.database }}
        path: |
          playwright-report/
          playwright-report-rerun/
        retention-days: 30
