name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.dockerignore'
      - 'docker-compose.dev.*.yml'
      - 'docker-compose.bundle.*.yml'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.bundle.*'
      - 'startup.bundle.*.sh'
      - 'scripts/test-bundle-user.sh'
      - 'Caddyfile'
      - '.github/workflows/playwright.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/server/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.nvmrc'
      - 'bun.lock'
      - '.dockerignore'
      - 'docker-compose.dev.*.yml'
      - 'docker-compose.bundle.*.yml'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.bundle.*'
      - 'startup.bundle.*.sh'
      - 'scripts/test-bundle-user.sh'
      - 'Caddyfile'
      - '.github/workflows/playwright.yml'
      - '!**/*.md'
    branches: [ main, master ]

# A new push to a PR replaces its run in progress, which would otherwise keep
# its runners busy testing a commit nobody waits for. Other runs get a group of
# their own: a shared one would cancel the queued runs of busy pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Compose names the images it builds <project>-<service>. Pinning the project
  # name makes the images from build-images match what the compose files expect.
  COMPOSE_PROJECT_NAME: peekaping

jobs:
  # The bundle jobs check how the single-image bundles are packaged, which only
  # their own files change. A PR runs them when it touches those files; pushes to
  # main always run them, so an app change that breaks a bundle fails there.
  changes:
    name: Detect bundle changes
    runs-on: ubuntu-24.04
    outputs:
      bundle: ${{ github.event_name != 'pull_request' || steps.diff.outputs.bundle }}
      # The e2e configs to run. A job's `if` can't read `matrix`, so the bundle config is left out
      # of the matrix itself.
      configs: ${{ (github.event_name != 'pull_request' || steps.diff.outputs.bundle == 'true') && '["dev","bundle"]' || '["dev"]' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check for bundle files
      id: diff
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(Dockerfile\.bundle\.|startup\.bundle\.|supervisord\.bundle\.|docker-compose\.bundle\.|scripts/test-bundle-user\.sh$|Caddyfile$|\.github/workflows/playwright\.yml$)'; then
          echo "bundle=true" >> "$GITHUB_OUTPUT"
        else
          echo "bundle=false" >> "$GITHUB_OUTPUT"
        fi

  # Build each image once, on its own runner, and share it with the test jobs.
  # The dev images don't depend on the database, so both dev jobs reuse them.
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dev-api, tag: peekaping-api, context: apps/server, file: apps/server/infra/Dockerfile.api }
          # The dev SQLite and PostgreSQL stacks run it as their `probe` service (it is the local probe's
          # instances), and the e2e jobs run it as a remote probe (e2e/remote-probe.spec.ts). Named without
          # "dev-" because the bundle jobs need it too, and they don't download image-dev-*; every e2e job
          # asks for it by name.
          - { name: probe, tag: peekaping-probe, context: apps/server, file: apps/server/infra/Dockerfile.probe }
          - { name: dev-migrate, tag: peekaping-migrate, context: apps/server, file: apps/server/infra/Dockerfile.migrate }
          - { name: dev-web, tag: peekaping-web, context: ., file: apps/web/Dockerfile }
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build ${{ matrix.name }} image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        tags: ${{ matrix.tag }}
        outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
        cache-from: type=gha,scope=e2e-${{ matrix.name }}
        cache-to: type=gha,scope=e2e-${{ matrix.name }},mode=max
    - uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.name }}
        path: ${{ runner.temp }}/${{ matrix.name }}.tar
        retention-days: 1
        # Image layers are already compressed.
        compression-level: 0

  # The bundle images, built like the others, only when the bundle jobs run. They are a job of their
  # own because a job's `if` can't read `matrix`.
  build-bundle-images:
    name: Build ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.bundle == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bundle-postgres, tag: peekaping-peekaping, context: ., file: Dockerfile.bundle.postgres }
          - { name: bundle-sqlite, tag: peekaping-peekaping, context: ., file: Dockerfile.bundle.sqlite }
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build ${{ matrix.name }} image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        tags: ${{ matrix.tag }}
        outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
        cache-from: type=gha,scope=e2e-${{ matrix.name }}
        cache-to: type=gha,scope=e2e-${{ matrix.name }},mode=max
    - uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.name }}
        path: ${{ runner.temp }}/${{ matrix.name }}.tar
        retention-days: 1
        # Image layers are already compressed.
        compression-level: 0

  # How the single-mode bundles run: the user, PUID/PGID, the Docker socket,
  # port 8383, ping and Docker monitors, docker run --user and docker stop.
  bundle-user:
    name: Bundle user ${{ matrix.database }}
    needs: [changes, build-bundle-images]
    if: ${{ !cancelled() && needs.changes.outputs.bundle == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
    - uses: actions/checkout@v4
    - name: Download image
      uses: actions/download-artifact@v4
      with:
        name: image-bundle-${{ matrix.database }}
        path: ${{ runner.temp }}/images
    - name: Load image
      run: docker load --input "$RUNNER_TEMP/images/bundle-${{ matrix.database }}.tar"
    - name: Test the bundle's user, ports and shutdown
      run: scripts/test-bundle-user.sh ${{ matrix.database }} peekaping-peekaping

  playwright-tests:
    name: E2E ${{ matrix.config }} ${{ matrix.database }}
    needs: [changes, build-images, build-bundle-images]
    # Run every combination whose images built, even if another image failed or the bundle images
    # were skipped.
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
        config: ${{ fromJSON(needs.changes.outputs.configs) }}
    env:
      # Every docker compose command below runs the stack plus the e2e target.
      COMPOSE_FILE: docker-compose.${{ matrix.config }}.${{ matrix.database }}.yml:docker-compose.e2e.yml
    steps:
    # Prepare environment and dependencies
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - name: Install dependencies
      run: bun install --frozen-lockfile
    # The browser download has taken over 7 minutes on a slow runner. The browser
    # build follows the Playwright version, which bun.lock pins.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: bunx playwright install --with-deps chromium
    # A cached browser still needs the system libraries, which live outside the cache.
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: bunx playwright install-deps chromium
    - name: Download images
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ matrix.config == 'dev' && 'image-dev-*' || format('image-bundle-{0}', matrix.database) }}
        path: ${{ runner.temp }}/images
        merge-multiple: true
    # The dev stack runs this image as its `probe` service, and the remote probe specs start it
    # themselves.
    - name: Download the probe image
      uses: actions/download-artifact@v4
      with:
        name: image-probe
        path: ${{ runner.temp }}/images
    - name: Load images
      run: |
        for image in "$RUNNER_TEMP"/images/*.tar; do
          docker load --input "$image"
        done

    # Prepare environment file
    - name: Create .env file
      run: |
        cat > .env << EOF
        # Database Configuration
        DB_TYPE=${{ matrix.database }}
        DB_HOST=database
        DB_PORT=${{ matrix.database == 'postgres' && '5432' }}
        DB_NAME=${{ matrix.database == 'sqlite' && '/app/data/peekaping.db' || 'peekaping' }}
        DB_USER=${{ matrix.database == 'postgres' && 'peekaping' || 'root' }}
        DB_PASS=password

        REDIS_HOST="redis"
        REDIS_PORT=6379
        REDIS_PASSWORD=""
        REDIS_DB=0

        # The shortest time before a remote probe that stopped is reported offline (default 3m).
        PROBE_OFFLINE_AFTER=2m

        # The local probe's token: the api stores it and the dev stack's probe service sends it. The
        # dev SQLite and PostgreSQL compose files refuse to start without it. The bundles have no use
        # for it, so they don't get it.
        ${{ matrix.config == 'dev' && 'PROBE_BOOTSTRAP_TOKEN=e2e-local-probe-token-0123456789abcdef0123456789' || '' }}

        # Server Configuration
        CLIENT_URL=http://localhost:8383
        SERVER_PORT=8034
        BUNDEBUG=2

        # The usage ping and error reports are on by default. A test run must not send either to
        # Peekaping, so both point at an address nothing listens on. The DSN must not be empty:
        # an empty one means Peekaping's own Sentry project.
        TELEMETRY_URL=http://127.0.0.1:9/v1/ping
        ERROR_REPORTING_DSN=http://public@127.0.0.1:9/1
        EOF

    # Create and prepare data directories with proper permissions
    - name: Prepare data directories
      run: |
        mkdir -p .data/postgres .data/logs .data/caddy-data .data/caddy-config
        sudo chown -R 999:999 .data/postgres .data/logs  # postgres user is typically uid 999
        sudo chmod -R 755 .data/logs
        sudo chmod -R 700 .data/postgres
        ls -la .data/
        echo "Directory permissions set successfully"

    # Start services from the prebuilt images using appropriate docker-compose file
    - name: Start services with docker-compose
      run: docker compose up -d --no-build

    - name: Show container logs
      run: |
        echo "=== Container Status ==="
        docker compose ps
        echo "=== Container Logs ==="
        docker compose logs

    - name: Wait for services to be ready
      run: |
        HEALTH_URL="http://localhost:${{ matrix.config == 'bundle' && '8383' || '8034' }}/api/v1/health"
        if ! timeout 120 bash -c "until curl -sf $HEALTH_URL && curl -sf http://localhost:8383/ && curl -sf http://localhost:3033/health; do sleep 2; done" >/dev/null; then
          echo "::error::The stack wasn't healthy after 120 seconds"
          docker compose ps
          docker compose logs
          exit 1
        fi
        echo "The stack is healthy"

    - name: Run Playwright tests
      run: bunx playwright test

    # The suite must also pass on the database the first run left behind. It
    # doubles the run time, so PRs skip it and main checks it after the merge.
    - name: Run Playwright tests again on the same database
      if: ${{ github.event_name == 'push' }}
      run: bunx playwright test
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-rerun

    - name: Show container logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs

    - name: Stop services
      if: always()
      run: docker compose down

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.config }}-${{ matrix.database }}
        path: |
          playwright-report/
          playwright-report-rerun/
        retention-days: 30
