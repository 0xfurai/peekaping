name: Deploy to Demo Environment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.2.3 or latest)'
        required: true
        type: string
        default: 'latest'
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.2.3 or latest)'
        required: true
        type: string

jobs:
  deploy-demo:
    runs-on: nexus-runner
    steps:
      - name: Deploy to Demo Environment
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: ${{ secrets.DEMO_USERNAME }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          port: ${{ secrets.DEMO_SSH_PORT || 22 }}
          script: |
            # ssh-action doesn't stop at a failed command, so a failed pull would still end green
            set -e

            echo "🚀 Starting demo deployment for version ${{ inputs.version }}"

            # Navigate to the demo directory
            cd ${{ secrets.DEMO_DEPLOY_PATH || '/opt/peekaping-demo' }}

            # Update docker compose to use the new version
            echo "📝 Updating docker compose with new image tags..."

            # Point every Peekaping image at the new version, whichever images the demo runs
            sed -i -E "s|(0xfurai/peekaping[a-z-]*):[A-Za-z0-9_.-]+|\1:${{ inputs.version }}|g" compose-demo.yaml
            grep -n 'image:' compose-demo.yaml || true

            # sed exits 0 when nothing matches, so check that an active image line changed
            if ! grep -E '^[[:space:]]*image:' compose-demo.yaml | grep -F ":${{ inputs.version }}" | grep -q '0xfurai/peekaping'; then
              echo "❌ No Peekaping image in compose-demo.yaml points at ${{ inputs.version }}"
              exit 1
            fi

            echo "📥 Pulling new Docker images..."
            docker compose -f compose-demo.yaml pull

            # echo "🔄 Recreating services with new images..."
            # docker compose up -d --force-recreate

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Demo deployment completed successfully!"
            echo "🌐 Demo should be available at the configured endpoint"

      # A release runs this job with continue-on-error, so a failed deploy leaves the job green. Say so on the run.
      - name: Warn that the demo was not updated
        if: steps.deploy.outcome == 'failure'
        run: echo "::warning title=Demo not updated::The demo deploy step failed. Read its log; the release is not affected."
