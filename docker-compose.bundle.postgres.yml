services:
  peekaping:
    build:
      context: .
      dockerfile: Dockerfile.bundle.postgres
    restart: unless-stopped
    # peekaping takes up to 30 seconds to shut down cleanly, and PostgreSQL stops after it
    stop_grace_period: 35s
    ports:
      - "8383:8383"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgres
      - DB_HOST=localhost
      - DB_PASS=password
      - DB_PORT=5432
    volumes:
      # Database data persistence. Logs go to the container's output (docker compose logs).
      - ./.data/postgres:/var/lib/postgresql/data
    container_name: peekaping-bundle-postgres
