services:
  peekaping:
    build:
      context: .
      dockerfile: Dockerfile.bundle.postgres
    restart: unless-stopped
    # peekaping takes up to 30 seconds to shut down cleanly, and PostgreSQL stops after it
    stop_grace_period: 35s
    ports:
      - "8383:8383"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgres
      - DB_HOST=localhost
      - DB_PASS=password
      - DB_PORT=5432
      # On by default, and not for a development stack (ADR 0003): point both at nothing. Set
      # TELEMETRY_URL and ERROR_REPORTING_DSN in .env to try them against a test endpoint.
      - TELEMETRY_URL=${TELEMETRY_URL:-http://127.0.0.1:9/v1/ping}
      - ERROR_REPORTING_DSN=${ERROR_REPORTING_DSN:-http://public@127.0.0.1:9/1}
    volumes:
      # Database data persistence. Logs go to the container's output (docker compose logs).
      - ./.data/postgres:/var/lib/postgresql/data
    container_name: peekaping-bundle-postgres
