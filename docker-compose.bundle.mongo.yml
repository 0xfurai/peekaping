services:
  peekaping:
    build:
      context: .
      dockerfile: Dockerfile.bundle.mongo
    restart: unless-stopped
    ports:
      - "8383:8383"
    env_file:
      - .env
    environment:
      - DB_TYPE=mongo
      - DB_HOST=localhost
      - DB_PASS=password
      - DB_PORT=27017
      # On by default, and not for a development stack (ADR 0003): point both at nothing. Set
      # TELEMETRY_URL and ERROR_REPORTING_DSN in .env to try them against a test endpoint.
      - TELEMETRY_URL=${TELEMETRY_URL:-http://127.0.0.1:9/v1/ping}
      - ERROR_REPORTING_DSN=${ERROR_REPORTING_DSN:-http://public@127.0.0.1:9/1}
    volumes:
      # Database data persistence
      - ./.data/mongodb:/data/db
      # Application logs persistence
      - ./.data/logs:/var/log/supervisor
      # Optional: Custom Caddyfile override
      # - ./custom-Caddyfile:/etc/caddy/Caddyfile:ro
    container_name: peekaping-bundle-mongo
